name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  eslint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: npm ci, build, lint, and format check
        run: |
          npm ci
          npm run build --if-present
          npm run lint
          npm run format:check
